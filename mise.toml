[tools]
gitleaks = "8.30.1"
taplo = "0.10.0"
actionlint = "1.7.12"

[vars]
packages = "agents ghostty git peek peep ssh starship zed zsh"

[tasks.setup]
description = "Install tools and enable this repository's Git hook"
run = [
  "mise install",
  "git config --local core.hooksPath .githooks",
]

[tasks.stow]
description = "Install dotfile symlinks into the home directory"
run = "stow --no-folding {{vars.packages}}"

[tasks.restow]
description = "Refresh dotfile symlinks after adding or moving files"
run = "stow --restow --no-folding {{vars.packages}}"

[tasks.unstow]
description = "Remove dotfile symlinks"
run = "stow --delete {{vars.packages}}"

[tasks.check]
description = "Check configuration syntax and scan working files for secrets"
depends = ["check:toml", "check:shell", "check:workflows", "secrets"]

[tasks."check:toml"]
run = "taplo check --no-schema mise.toml .gitleaks.toml peek/.config/peek/config.toml peep/.config/peep/peep.toml starship/.config/starship.toml"

[tasks."check:shell"]
run = ["zsh -n zsh/.zshrc zsh/.zprofile", "sh -n .githooks/pre-commit"]

[tasks."check:workflows"]
run = "actionlint"

[tasks.secrets]
description = "Scan working files for secrets"
run = "gitleaks dir --redact ."

[tasks."secrets:staged"]
description = "Scan staged changes before committing"
run = "gitleaks git --pre-commit --staged --redact ."

[tasks."secrets:history"]
description = "Scan all Git history for secrets"
run = "gitleaks git --redact --log-opts=--all ."
